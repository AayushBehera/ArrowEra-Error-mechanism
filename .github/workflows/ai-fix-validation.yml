name: ArrowEra AI fix validation
on:
  push:
    branches: ["arrowera/fix-*", "arrowera/fix/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate AI-generated patch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Type-check
        if: hashFiles('package.json') != ''
        run: npm run typecheck --if-present
      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present
      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test --if-present
      - name: Production build
        if: hashFiles('package.json') != ''
        run: npm run build --if-present
      - name: Validate Python project
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          python -m compileall -q .
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] && grep -q '\[tool.pytest' pyproject.toml; then python -m pip install pytest && python -m pytest -q; fi

  open-pull-request:
    name: Open PR after successful validation
    needs: validate
    if: github.event_name == 'push' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create pull request after validation
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: context.repo.owner + ':' + branch,
              state: 'open'
            });
            if (existing.data.length) {
              core.notice('A pull request already exists: ' + existing.data[0].html_url);
              return;
            }
            const pull = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'main',
              title: '[ArrowEra] Validated automated remediation',
              body: '## Automated remediation\n\nThis patch was generated from repository evidence by ArrowEra Copilot.\n\n**Validation:** GitHub Actions validation workflow passed before this pull request was opened.\n\nPlease review the diff and runtime impact before merging.'
            });
            core.notice('Opened validated pull request: ' + pull.data.html_url);
