name: ArrowEra AI fix validation
on:
  push:
    branches: ["arrowera/fix-*", "arrowera/fix/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate AI-generated patch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Type-check
        if: hashFiles('package.json') != ''
        run: npm run typecheck --if-present
      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present
      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test --if-present
      - name: Production build
        if: hashFiles('package.json') != ''
        run: npm run build --if-present
      - name: Validate Python project
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          python -m compileall -q .
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] && grep -q '\[tool.pytest' pyproject.toml; then python -m pip install pytest && python -m pytest -q; fi
