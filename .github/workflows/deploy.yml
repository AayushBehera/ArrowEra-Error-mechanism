name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before deployment
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Build and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed application
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          page_url="${PAGE_URL%/}/"

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-connrefused \
            "$page_url" -o "$RUNNER_TEMP/arrowera-index.html"

          grep -Fq '<title>ArrowEra · Error Mechanism</title>' \
            "$RUNNER_TEMP/arrowera-index.html"

          curl --fail --silent --show-error --location \
            "${page_url}arrow.svg" -o /dev/null
